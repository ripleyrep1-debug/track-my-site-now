<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Track Shipment - Logiport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/lib/animate/animate.min.css" rel="stylesheet">
<link href="assets/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
<link href="assets/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<style>
  .track-hero { background: #0d2c54; color: #fff; padding: 120px 0 60px; }
  .track-form .form-control { height: 56px; }
  .timeline { position: relative; padding-left: 32px; }
  .timeline:before { content: ''; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: #e3e6ef; }
  .timeline .item { position: relative; padding-bottom: 28px; }
  .timeline .item:before { content: ''; position: absolute; left: -28px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: #e3e6ef; border: 3px solid #fff; box-shadow: 0 0 0 1px #e3e6ef; }
  .timeline .item.done:before { background: var(--bs-primary, #ff6b00); box-shadow: 0 0 0 1px var(--bs-primary, #ff6b00); }
  .timeline .item.current:before { background: var(--bs-primary, #ff6b00); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,107,0,.5)} 70%{box-shadow:0 0 0 12px rgba(255,107,0,0)} 100%{box-shadow:0 0 0 0 rgba(255,107,0,0)} }
  .status-pill { display: inline-flex; align-items: center; gap: 8px; background: #fff3e8; color: #c75300; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff6b00; }
</style>
</head>
<body>

<div class="track-hero">
  <div class="container">
    <a href="index.html" class="text-white text-decoration-none small"><i class="bi bi-arrow-left"></i> Back to home</a>
    <h1 class="display-5 fw-bold mt-3">Track your shipment</h1>
    <p class="lead opacity-75 mb-4">Enter the tracking number from your shipping confirmation.</p>
    <form id="trackForm" class="row g-2 track-form bg-white p-2 rounded shadow-sm" style="max-width: 720px;">
      <div class="col-md-8">
        <input id="trackInput" type="text" required class="form-control border-0" placeholder="Enter tracking number" />
      </div>
      <div class="col-md-4">
        <button type="submit" class="btn btn-primary w-100 h-100">Track Now</button>
      </div>
    </form>
  </div>
</div>

<div class="container py-5">
  <div id="result"></div>
  <div id="empty" class="text-center py-5 text-muted" style="display:none;">
    <i class="bi bi-box-seam" style="font-size: 48px;"></i>
    <p class="mt-3">Enter a tracking number above to view your shipment status.</p>
  </div>
</div>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<script>
(function () {
  function getParam(n) {
    return new URLSearchParams(window.location.search).get(n);
  }
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) >>> 0;
    return h;
  }
  function buildData(id) {
    var h = hash(id);
    var routes = [
      ['Shanghai, CN', 'Rotterdam, NL'],
      ['Los Angeles, US', 'Hamburg, DE'],
      ['Singapore, SG', 'New York, US'],
      ['Dubai, AE', 'Felixstowe, UK']
    ];
    var r = routes[h % routes.length];
    var step = h % 5;
    var stages = [
      { label: 'Order received', loc: r[0], time: 'May 14, 09:12' },
      { label: 'Picked up', loc: r[0], time: 'May 15, 14:30' },
      { label: 'In transit', loc: 'Mid-Ocean', time: 'May 18, 22:05' },
      { label: 'Arrived at port', loc: r[1], time: 'May 21, 06:48' },
      { label: 'Out for delivery', loc: r[1], time: 'May 22, 08:15' },
      { label: 'Delivered', loc: r[1], time: 'May 22, 17:40' }
    ].map(function (s, i) {
      return { label: s.label, loc: s.loc, time: s.time, done: i <= step, current: i === step };
    });
    return { id: id, origin: r[0], destination: r[1], eta: 'May 23, 18:00', carrier: 'Logiport Express', stages: stages };
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); }
  function render(id) {
    var d = buildData(id);
    var current = d.stages.filter(function (s) { return s.current; })[0] || d.stages[d.stages.length - 1];
    var rows = d.stages.map(function (s) {
      return '<div class="item ' + (s.done ? 'done ' : '') + (s.current ? 'current' : '') + '">' +
        '<div class="d-flex justify-content-between flex-wrap">' +
          '<div><div class="fw-semibold ' + (s.done ? 'text-dark' : 'text-muted') + '">' + esc(s.label) + '</div>' +
          '<div class="small text-muted">' + esc(s.loc) + '</div></div>' +
          '<div class="small text-muted">' + esc(s.time) + '</div>' +
        '</div></div>';
    }).join('');
    document.getElementById('result').innerHTML =
      '<div class="bg-white shadow-sm rounded p-4 p-md-5 mb-4">' +
        '<div class="d-flex justify-content-between flex-wrap gap-3 align-items-start">' +
          '<div><div class="text-uppercase small text-muted fw-bold">Tracking ID</div>' +
          '<div class="h3 fw-bold mb-0">' + esc(d.id) + '</div></div>' +
          '<span class="status-pill"><span class="dot"></span>' + esc(current.label) + '</span>' +
        '</div>' +
        '<hr/>' +
        '<div class="row g-4">' +
          '<div class="col-6 col-md-3"><div class="small text-muted text-uppercase fw-bold">Origin</div><div class="fw-semibold">' + esc(d.origin) + '</div></div>' +
          '<div class="col-6 col-md-3"><div class="small text-muted text-uppercase fw-bold">Destination</div><div class="fw-semibold">' + esc(d.destination) + '</div></div>' +
          '<div class="col-6 col-md-3"><div class="small text-muted text-uppercase fw-bold">ETA</div><div class="fw-semibold">' + esc(d.eta) + '</div></div>' +
          '<div class="col-6 col-md-3"><div class="small text-muted text-uppercase fw-bold">Carrier</div><div class="fw-semibold">' + esc(d.carrier) + '</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="bg-white shadow-sm rounded p-4 p-md-5">' +
        '<h4 class="fw-bold mb-4">Shipment timeline</h4>' +
        '<div class="timeline">' + rows + '</div>' +
      '</div>';
  }
  var id = getParam('id');
  if (id) { render(id); document.getElementById('trackInput').value = id; }
  else { document.getElementById('empty').style.display = 'block'; }
  document.getElementById('trackForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('trackInput').value.trim();
    if (!v) return;
    history.replaceState(null, '', 'track.html?id=' + encodeURIComponent(v));
    render(v);
  });
})();
</script>
</body>
</html>
