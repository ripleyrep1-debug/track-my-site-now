<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Track Shipment - Logiport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<style>
  .track-hero { background: #0d2c54; color: #fff; padding: 120px 0 60px; }
  .track-form .form-control { height: 56px; }
  .timeline { position: relative; padding-left: 32px; }
  .timeline:before { content: ''; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: #e3e6ef; }
  .timeline .item { position: relative; padding-bottom: 28px; }
  .timeline .item:before { content: ''; position: absolute; left: -28px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: #e3e6ef; border: 3px solid #fff; box-shadow: 0 0 0 1px #e3e6ef; }
  .timeline .item.done:before { background: #ff6b00; box-shadow: 0 0 0 1px #ff6b00; }
  .timeline .item.current:before { background: #ff6b00; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,107,0,.5)} 70%{box-shadow:0 0 0 12px rgba(255,107,0,0)} 100%{box-shadow:0 0 0 0 rgba(255,107,0,0)} }
  .status-pill { display: inline-flex; align-items: center; gap: 8px; background: #fff3e8; color: #c75300; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff6b00; }
</style>
</head>
<body>

<div class="track-hero">
  <div class="container">
    <a href="index.html" class="text-white text-decoration-none small"><i class="bi bi-arrow-left"></i> Back to home</a>
    <h1 class="display-5 fw-bold mt-3">Track your shipment</h1>
    <p class="lead opacity-75 mb-4">Enter the tracking number from your shipping confirmation.</p>
    <form id="trackForm" class="row g-2 track-form bg-white p-2 rounded shadow-sm" style="max-width: 720px;">
      <div class="col-md-8">
        <input id="trackInput" type="text" required class="form-control border-0" placeholder="Enter tracking number" />
      </div>
      <div class="col-md-4">
        <button type="submit" class="btn btn-primary w-100 h-100">Track Now</button>
      </div>
    </form>
  </div>
</div>

<div class="container py-5">
  <div id="status" class="text-center py-3" style="display:none;"></div>
  <div id="result"></div>
  <div id="empty" class="text-center py-5 text-muted" style="display:none;">
    <i class="bi bi-box-seam" style="font-size: 48px;"></i>
    <p class="mt-3">Enter a tracking number above to view your shipment status.</p>
  </div>
</div>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<script>
(function () {
  function getParam(n) { return new URLSearchParams(window.location.search).get(n); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); }
  function fmt(t) { if (!t) return ''; try { return new Date(t).toLocaleString(); } catch(e) { return t; } }

  function render(d) {
    var stages = (d.events || []).slice().sort(function(a,b){ return (a.sequence||0)-(b.sequence||0) || new Date(a.event_time)-new Date(b.event_time); });
    var lastIdx = stages.length - 1;
    var rows = stages.map(function (s, i) {
      var done = i <= lastIdx;
      var current = i === lastIdx;
      return '<div class="item ' + (done ? 'done ' : '') + (current ? 'current' : '') + '">' +
        '<div class="d-flex justify-content-between flex-wrap">' +
          '<div><div class="fw-semibold text-dark">' + esc(s.label) + '</div>' +
          '<div class="small text-muted">' + esc(s.location || '') + '</div></div>' +
          '<div class="small text-muted">' + esc(fmt(s.event_time)) + '</div>' +
        '</div></div>';
    }).join('');

    document.getElementById('result').innerHTML =
      '<div class="bg-white shadow-sm rounded p-4 p-md-5 mb-4">' +
        '<div class="d-flex justify-content-between flex-wrap gap-3 align-items-start">' +
          '<div><div class="text-uppercase small text-muted fw-bold">Tracking ID</div>' +
          '<div class="h3 fw-bold mb-0">' + esc(d.shipment.tracking_number) + '</div></div>' +
          '<span class="status-pill"><span class="dot"></span>' + esc(d.shipment.status) + '</span>' +
        '</div>' +
        '<hr/>' +
        '<div class="row g-4">' +
          '<div class="col-6 col-md-3"><div class="small text-muted text-uppercase fw-bold">Origin</div><div class="fw-semibold">' + esc(d.shipment.origin) + '</div></div>' +
          '<div class="col-6 col-md-3"><div class="small text-muted text-uppercase fw-bold">Destination</div><div class="fw-semibold">' + esc(d.shipment.destination) + '</div></div>' +
          '<div class="col-6 col-md-3"><div class="small text-muted text-uppercase fw-bold">ETA</div><div class="fw-semibold">' + esc(d.shipment.eta ? fmt(d.shipment.eta) : '—') + '</div></div>' +
          '<div class="col-6 col-md-3"><div class="small text-muted text-uppercase fw-bold">Carrier</div><div class="fw-semibold">' + esc(d.shipment.carrier) + '</div></div>' +
        '</div>' +
      '</div>' +
      (stages.length ?
        '<div class="bg-white shadow-sm rounded p-4 p-md-5">' +
          '<h4 class="fw-bold mb-4">Shipment timeline</h4>' +
          '<div class="timeline">' + rows + '</div>' +
        '</div>'
        : '<div class="alert alert-light border">No timeline events have been logged yet.</div>'
      );
  }

  function setStatus(html) {
    var el = document.getElementById('status');
    if (!html) { el.style.display = 'none'; return; }
    el.innerHTML = html; el.style.display = 'block';
  }

  function lookup(id) {
    document.getElementById('result').innerHTML = '';
    document.getElementById('empty').style.display = 'none';
    setStatus('<div class="text-muted small"><i class="bi bi-hourglass-split"></i> Looking up ' + esc(id) + '…</div>');
    fetch('/api/public/track?id=' + encodeURIComponent(id))
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; }); })
      .then(function (res) {
        setStatus('');
        if (res.status === 404 || res.body.found === false) {
          document.getElementById('result').innerHTML =
            '<div class="bg-white shadow-sm rounded p-5 text-center">' +
              '<i class="bi bi-exclamation-circle" style="font-size:48px;color:#ff6b00"></i>' +
              '<h4 class="fw-bold mt-3">No shipment found</h4>' +
              '<p class="text-muted">We could not find a shipment with tracking number <strong>' + esc(id) + '</strong>. Please check the number and try again.</p>' +
            '</div>';
          return;
        }
        if (!res.ok) {
          setStatus('<div class="text-danger">' + esc(res.body.error || 'Lookup failed') + '</div>');
          return;
        }
        render(res.body);
      })
      .catch(function () { setStatus('<div class="text-danger">Network error. Please try again.</div>'); });
  }

  var id = getParam('id');
  if (id) { document.getElementById('trackInput').value = id; lookup(id); }
  else { document.getElementById('empty').style.display = 'block'; }
  document.getElementById('trackForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('trackInput').value.trim();
    if (!v) return;
    history.replaceState(null, '', 'track.html?id=' + encodeURIComponent(v));
    lookup(v);
  });
})();
</script>
</body>
</html>
